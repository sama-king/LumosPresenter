name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every platform the app packages for builds and tests here, so platform-specific code
  # (the native file dialog, audio and speech natives) cannot break one OS unnoticed.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # TODO(week-4): golden-audio pipeline job, and a packaging job running
      # src/LumosPresenter.Launcher/package.sh per platform once the default model
      # is fetchable in CI (seeds are committed; the speech models are not).
